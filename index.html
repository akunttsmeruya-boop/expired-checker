                    <div class="barcode-search">
                        <input
                            type="text"
                            id="barcode1"
                            placeholder="Scan / Ketik Barcode"
                            autocomplete="off"
                            inputmode="numeric"
                        >
                    </div>

                    <div id="productName1" class="product-name"></div>
                </div>

                <div class="expired-area">
                    <label for="expired1">Expired</label>

                    <input
                        type="text"
                        id="expired1"
                        placeholder="DDMMYY"
                        maxlength="6"
                        inputmode="numeric"
                        autocomplete="off"
                    >

                    <small>Format: DDMMYY</small>
                </div>

            </div>

            <div class="nie-area">
                <label for="izin1">Nomor Izin Edar</label>

                <input
                    type="text"

                    placeholder="Masukkan Nomor Izin Edar"
