<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CEK PRODUK EXPIRED</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- ==================================================
         LOADING DATABASE
         ================================================== -->

    <div id="databaseLoading">

        <div class="database-loading-box">

            <div class="loading-spinner"></div>

            <div>
                Memuat database...
            </div>

        </div>

    </div>


    <!-- ==================================================
         CONTAINER
         ================================================== -->

    <div class="container">


        <!-- ==================================================
             HEADER
             ================================================== -->

        <header>

            <h1>
                CEK PRODUK EXPIRED
            </h1>

            <p>
                Scan atau masukkan barcode produk
            </p>

        </header>


        <!-- ==================================================
             MAIN
             ================================================== -->

        <main>


            <!-- ==================================================
                 PRODUK 1
                 ================================================== -->

            <section class="product-box">

                <div class="input-row">


                    <!-- BARCODE -->

                    <div class="barcode-area">

                        <div class="barcode-label-row">

                            <span class="product-number">
                                1
                            </span>

                            <label for="barcode1">
                                Barcode
                            </label>

                        </div>


                        <div class="barcode-search">

                            <input
                                type="text"
                                id="barcode1"
                                placeholder="Scan / Ketik Barcode"
                                autocomplete="off"
                                inputmode="numeric"
                            >


                            <button
                                type="button"
                                id="scanButton1"
                                onclick="toggleScanner(1)"
                            >
                                SCAN
                            </button>

                        </div>


                        <div
                            id="productName1"
                            class="product-name"
                        ></div>


                        <div
                            id="scanner1"
                            class="scanner-container"
                        ></div>

                    </div>


                    <!-- EXPIRED -->

                    <div class="expired-area">

                        <label for="expired1">
                            Expired
                        </label>


                        <input
                            type="text"
                            id="expired1"
                            placeholder="DDMMYY"
                            maxlength="6"
                            inputmode="numeric"
                            autocomplete="off"
                        >


                        <small>
                            Format: DDMMYY
                        </small>

                    </div>

                </div>


                <!-- NIE -->

                <div class="nie-area">

                    <label for="izin1">
                        Nomor Izin Edar
                    </label>


                    <input
                        type="text"
                        id="izin1"
                        placeholder="Masukkan Nomor Izin Edar"
                        autocomplete="off"
                    >

                </div>

            </section>



            <!-- ==================================================
                 PRODUK 2
                 ================================================== -->

            <section class="product-box">

                <div class="input-row">


                    <!-- BARCODE -->

                    <div class="barcode-area">

                        <div class="barcode-label-row">

                            <span class="product-number">
                                2
                            </span>

                            <label for="barcode2">
                                Barcode
                            </label>

                        </div>


                        <div class="barcode-search">

                            <input
                                type="text"
                                id="barcode2"
                                placeholder="Scan / Ketik Barcode"
                                autocomplete="off"
                                inputmode="numeric"
                            >


                            <button
                                type="button"
                                id="scanButton2"
                                onclick="toggleScanner(2)"
                            >
                                SCAN
                            </button>

                        </div>


                        <div
                            id="productName2"
                            class="product-name"
                        ></div>


                        <div
                            id="scanner2"
                            class="scanner-container"
                        ></div>

                    </div>


                    <!-- EXPIRED -->

                    <div class="expired-area">

                        <label for="expired2">
                            Expired
                        </label>


                        <input
                            type="text"
                            id="expired2"
                            placeholder="DDMMYY"
                            maxlength="6"
                            inputmode="numeric"
                            autocomplete="off"
                        >


                        <small>
                            Format: DDMMYY
                        </small>

                    </div>

                </div>


                <!-- NIE -->

                <div class="nie-area">

                    <label for="izin2">
                        Nomor Izin Edar
                    </label>


                    <input
                        type="text"
                        id="izin2"
                        placeholder="Masukkan Nomor Izin Edar"
                        autocomplete="off"
                    >

                </div>

            </section>



            <!-- ==================================================
                 PRODUK 3
                 ================================================== -->

            <section class="product-box">

                <div class="input-row">


                    <!-- BARCODE -->

                    <div class="barcode-area">

                        <div class="barcode-label-row">

                            <span class="product-number">
                                3
                            </span>

                            <label for="barcode3">
                                Barcode
                            </label>

                        </div>


                        <div class="barcode-search">

                            <input
                                type="text"
                                id="barcode3"
                                placeholder="Scan / Ketik Barcode"
                                autocomplete="off"
                                inputmode="numeric"
                            >


                            <button
                                type="button"
                                id="scanButton3"
                                onclick="toggleScanner(3)"
                            >
                                SCAN
                            </button>

                        </div>


                        <div
                            id="productName3"
                            class="product-name"
                        ></div>


                        <div
                            id="scanner3"
                            class="scanner-container"
                        ></div>

                    </div>


                    <!-- EXPIRED -->

                    <div class="expired-area">

                        <label for="expired3">
                            Expired
                        </label>


                        <input
                            type="text"
                            id="expired3"
                            placeholder="DDMMYY"
                            maxlength="6"
                            inputmode="numeric"
                            autocomplete="off"
                        >


                        <small>
                            Format: DDMMYY
                        </small>

                    </div>

                </div>


                <!-- NIE -->

                <div class="nie-area">

                    <label for="izin3">
                        Nomor Izin Edar
                    </label>


                    <input
                        type="text"
                        id="izin3"
                        placeholder="Masukkan Nomor Izin Edar"
                        autocomplete="off"
                    >

                </div>

            </section>



            <!-- ==================================================
                 PESAN
                 ================================================== -->

            <div
                id="message"
                class="message"
                role="alert"
            ></div>



            <!-- ==================================================
                 SIMPAN
                 ================================================== -->

            <button
                type="button"
                id="saveButton"
                onclick="saveAllProducts()"
            >
                SIMPAN SEMUA
            </button>


        </main>



        <!-- ==================================================
             FOOTER
             ================================================== -->

        <footer>
            CEK PRODUK EXPIRED
        </footer>


    </div>



    <!-- ==================================================
         HTML5 QR CODE
         ================================================== -->

    <script src="https://unpkg.com/html5-qrcode"></script>


    <!-- ==================================================
         SCRIPT UTAMA
         ================================================== -->

    <script src="script.js"></script>


</body>

</html>
