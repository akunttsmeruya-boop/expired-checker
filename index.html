            <h1>

                 PRODUK 1
                 ================================================== -->

            <section class="product-box">

                <div class="product-main-row">

                    <span class="product-number">
                        1
                    </span>


                    <!-- BARCODE -->

                    <div class="barcode-area">

                        <div class="barcode-search">

                            <input
                                type="text"
                                id="barcode1"
                                placeholder="Scan / Ketik Barcode"
                                autocomplete="off"
                                inputmode="numeric"
                            >

                            <button
                                type="button"
                                id="scanButton1"
                                onclick="toggleScanner(1)"
                            >
                                SCAN
                            </button>

                        </div>


                        <div
                            id="productName1"
                            class="product-name"
                        ></div>


                        <div
                            id="scanner1"
                            class="scanner-container"
                        ></div>

                    </div>


                    <!-- EXPIRED -->

                    <div class="expired-inline">

                        <label for="expired1">
                            Expired
                        </label>

                        <input
                            type="text"
                            id="expired1"
                            placeholder="DDMMYY"
                            maxlength="6"
                            inputmode="numeric"
                            autocomplete="off"
                        >

                        <small>
                            DDMMYY
                        </small>

                    </div>

                </div>


                <!-- NIE -->

                <div class="nie-row">

                    <label for="izin1">
                        Nomor Izin Edar
